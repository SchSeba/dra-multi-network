# Apply to /etc/crio/crio.conf.d/20-dra-multi-network.conf and restart CRI-O.
# Required plugins are selected by protected Pod annotations so the agent and
# control plane can bootstrap while project workloads fail closed if it is absent.
[crio.nri]
nri_plugin_request_timeout = "10s"
[crio.nri.default_validator]
nri_enable_default_validator = true
