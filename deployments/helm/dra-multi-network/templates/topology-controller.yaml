apiVersion: v1
kind: ServiceAccount
metadata:
  name: dra-multi-network-controller
  namespace: {{ include "dra-multi-network.namespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dra-multi-network-controller
rules:
- apiGroups: ["networking.dra-multi-network.schseba.github.io"]
  resources: ["networkplugins", "networkplugins/status", "networktopologies", "networktopologies/status", "networktopologyrevisions", "networktopologyrevisions/status", "deviceexposurepolicies", "networkattachmentstatuses"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: ["networking.dra-multi-network.schseba.github.io"]
  resources: ["networktopologyrevisions"]
  verbs: ["delete"]
- apiGroups: ["resource.k8s.io"]
  resources: ["deviceclasses", "resourceslices"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["resource.k8s.io"]
  resources: ["resourceclaims", "resourceclaimtemplates"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods", "nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["patch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["servicecidrs"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["daemonsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update"]
- apiGroups: ["admissionregistration.k8s.io"]
  resources: ["validatingwebhookconfigurations", "mutatingwebhookconfigurations"]
  resourceNames: ["dra-multi-network-webhook"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dra-multi-network-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dra-multi-network-controller
subjects:
- kind: ServiceAccount
  name: dra-multi-network-controller
  namespace: {{ include "dra-multi-network.namespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dra-multi-network-ipam-controller
  namespace: {{ include "dra-multi-network.namespace" . }}
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dra-multi-network-ipam-controller
  namespace: {{ include "dra-multi-network.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dra-multi-network-ipam-controller
subjects:
- kind: ServiceAccount
  name: dra-multi-network-controller
  namespace: {{ include "dra-multi-network.namespace" . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dra-multi-network-controller
  namespace: {{ include "dra-multi-network.namespace" . }}
spec:
  replicas: 1
  # Bootstrap creates cluster-scoped descriptors through this same webhook.
  # Retire the old validator before initializing new builtin contracts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dra-multi-network-controller
  template:
    metadata:
      annotations:
        dra-multi-network.schseba.github.io/bootstrap-nri-toleration: "true"
      labels:
        app: dra-multi-network-controller
    spec:
      serviceAccountName: dra-multi-network-controller
      containers:
      - name: controller
        image: {{ include "dra-multi-network.fullimage" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: [/usr/bin/dra-multi-network-controller]
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        - name: webhook
          containerPort: 9443
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: dra-multi-network-webhook
  namespace: {{ include "dra-multi-network.namespace" . }}
spec:
  publishNotReadyAddresses: true
  selector:
    app: dra-multi-network-controller
  ports:
  - port: 443
    targetPort: webhook
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: dra-multi-network-webhook
webhooks:
- name: validate.networking.dra-multi-network.schseba.github.io
  admissionReviewVersions: [v1]
  sideEffects: None
  failurePolicy: Fail
  timeoutSeconds: 5
  namespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: NotIn
      values: [{{ include "dra-multi-network.namespace" . }}]
  clientConfig:
    service:
      name: dra-multi-network-webhook
      namespace: {{ include "dra-multi-network.namespace" . }}
      path: /validate
  rules:
  - apiGroups: ["networking.dra-multi-network.schseba.github.io"]
    apiVersions: [v1alpha1]
    operations: [CREATE, UPDATE, DELETE]
    resources: ["networktopologies", "networkplugins", "deviceexposurepolicies", "networktopologyrevisions", "networkattachmentstatuses", "networkattachmentstatuses/status"]
  - apiGroups: ["resource.k8s.io"]
    apiVersions: [v1]
    operations: [CREATE, UPDATE, DELETE]
    resources: ["deviceclasses", "resourceclaims", "resourceclaimtemplates"]
  - apiGroups: [""]
    apiVersions: [v1]
    operations: [CREATE, UPDATE]
    resources: ["pods", "pods/ephemeralcontainers", "pods/binding", "bindings"]
  - apiGroups: [""]
    apiVersions: [v1]
    operations: [CREATE, UPDATE]
    resources: ["nodes"]
- name: ipam.networking.dra-multi-network.schseba.github.io
  admissionReviewVersions: [v1]
  sideEffects: None
  failurePolicy: Fail
  timeoutSeconds: 5
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: {{ include "dra-multi-network.namespace" . }}
  clientConfig:
    service:
      name: dra-multi-network-webhook
      namespace: {{ include "dra-multi-network.namespace" . }}
      path: /validate
  rules:
  - apiGroups: [""]
    apiVersions: [v1]
    operations: [CREATE, UPDATE, DELETE]
    resources: ["configmaps"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: dra-multi-network-webhook
webhooks:
- name: mutate.networking.dra-multi-network.schseba.github.io
  admissionReviewVersions: [v1]
  sideEffects: None
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  timeoutSeconds: 5
  namespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: NotIn
      values: [{{ include "dra-multi-network.namespace" . }}]
  clientConfig:
    service:
      name: dra-multi-network-webhook
      namespace: {{ include "dra-multi-network.namespace" . }}
      path: /mutate
  rules:
  - apiGroups: [""]
    apiVersions: [v1]
    operations: [CREATE]
    resources: ["pods"]
