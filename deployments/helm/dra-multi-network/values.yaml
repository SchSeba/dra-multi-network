# Default values for dra-multi-network.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""
selectorLabelsOverride: {}

allowDefaultNamespace: false

imagePullSecrets: []
image:
  repository: ghcr.io/schseba/dra-multi-network
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: dra-multi-network-node

controller:
  priorityClassName: "system-node-critical"
  podAnnotations: {}
  podSecurityContext: {}
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  affinity: {}
  containers:
    controller:
      securityContext: {}
      resources: {}

kubeletPlugin:
  priorityClassName: "system-node-critical"
  updateStrategy:
    type: RollingUpdate
  podAnnotations: {}
  podSecurityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  kubeletRegistrarDirectoryPath: /var/lib/kubelet/plugins_registry
  kubeletPluginsDirectoryPath: /var/lib/kubelet/plugins
  nriPluginName: dra-multi-network
  nriPluginIndex: 42
  ovs:
    # Expose the existing host OVSDB socket to the native effect executor.
    # Enable only on nodes with an administrator-managed OVS installation.
    enabled: false
  containers:
    plugin:
      securityContext:
        privileged: true
      resources: {}

# Logging configuration
logging:
  # Log verbosity level (0-9, higher means more verbose)
  level: 3
  # Log format: text or json
  format: text
  # Whether to log to stderr (in addition to any log files)
  alsologtostderr: true
  # Optional: log file path (if empty, logs only to stderr)
  logFile: ""

