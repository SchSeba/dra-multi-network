apiVersion: networking.dra-multi-network.schseba.github.io/v1alpha1
kind: NetworkTopology
metadata:
  name: dual-vf-bond-vlan
spec:
  effectBudget:
    allow:
    - linux/link-move/v1
    - linux/link-configure/v1
    - linux/create-bond/v1
    - linux/attach-master/v1
    - linux/create-vlan/v1
    - linux/ipv4-forwarding/v1
  steps:
  - id: left
    kind: Allocation
    pluginRef: {name: sriov-cni}
    selectors:
    - 'device.attributes["dra-multi-network.schseba.github.io"].pfPciAddress == "0000:29:00.0"'
    config: {mode: kernel, linkType: ethernet, ifName: vfleft, mtu: 1500, up: true, rdmaAccess: false}
  - id: right
    kind: Allocation
    pluginRef: {name: sriov-cni}
    selectors:
    - 'device.attributes["dra-multi-network.schseba.github.io"].pfPciAddress == "0000:29:00.0"'
    config: {mode: kernel, linkType: ethernet, ifName: vfright, mtu: 1500, up: true, rdmaAccess: false}
  - id: uplink
    kind: Operation
    pluginRef: {name: bond-cni}
    inputs:
      members: [{from: left.interface}, {from: right.interface}]
    config: {ifName: bond0, mtu: 1500, up: true, mode: active-backup, monitorIntervalMs: 100, failOverMac: active}
  - id: tenant100
    kind: Operation
    pluginRef: {name: vlan-cni}
    inputs:
      parent: {from: uplink.interface}
    config: {ifName: tenant100, mtu: 1500, up: true, vlanId: 100}
  - id: tenant200
    kind: Operation
    pluginRef: {name: vlan-cni}
    inputs:
      parent: {from: uplink.interface}
    config: {ifName: tenant200, mtu: 1500, up: true, vlanId: 200}
  - id: tenant300
    kind: Operation
    pluginRef: {name: vlan-cni}
    inputs:
      parent: {from: uplink.interface}
    config: {ifName: tenant300, mtu: 1500, up: true, vlanId: 300}
  - id: tune100
    kind: Operation
    pluginRef: {name: tuning-cni}
    inputs:
      interface: {from: tenant100.interface}
    config: {ipv4Forward: true}
  - id: tune200
    kind: Operation
    pluginRef: {name: tuning-cni}
    inputs:
      interface: {from: tenant200.interface}
    config: {ipv4Forward: true}
  - id: tune300
    kind: Operation
    pluginRef: {name: tuning-cni}
    inputs:
      interface: {from: tenant300.interface}
    config: {ipv4Forward: true}
