# The example script substitutes the actual revision's root class names.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata: {name: CLAIM_TEMPLATE, namespace: multi-network-example}
spec:
  spec:
    devices:
      requests:
      - name: primary
        exactly: {deviceClassName: LEFT_CLASS, allocationMode: ExactCount, count: 1}
      - name: backup
        exactly: {deviceClassName: RIGHT_CLASS, allocationMode: ExactCount, count: 1}
---
apiVersion: v1
kind: Pod
metadata:
  name: network-mvp
  namespace: multi-network-example
  annotations:
    required-plugins.noderesource.dev: '["dra-multi-network"]'
spec:
  terminationGracePeriodSeconds: 1
  nodeSelector:
    dra-multi-network.schseba.github.io/ready: "true"
  resourceClaims:
  - name: secondary
    resourceClaimTemplateName: CLAIM_TEMPLATE
  initContainers:
  - name: verify-network
    securityContext:
      capabilities: {add: [NET_ADMIN, NET_RAW]}
    image: quay.io/schseba/toolbox:latest
    command: [/bin/bash, -ec]
    args:
    - |
      ip -d link show bond0
      for tag in 100 200 300; do
        ip -d link show "tenant$tag"
        ip -d -o link show "tenant$tag" | grep -q "vlan protocol 802.1Q id $tag "
        test "$(cat /proc/sys/net/ipv4/conf/tenant$tag/forwarding)" = 1
      done
      test "$(cat /sys/class/net/bond0/bonding/mode)" = "active-backup 1"
      test "$(tr ' ' '\n' < /sys/class/net/bond0/bonding/slaves | sed '/^$/d' | sort | xargs)" = "vfleft vfright"
    resources:
      claims: [{name: secondary}]
  containers:
  - name: app
    image: quay.io/schseba/toolbox:latest
    command: [sleep, infinity]
    securityContext:
      capabilities: {add: [NET_ADMIN, NET_RAW]}
    resources:
      claims: [{name: secondary}]
