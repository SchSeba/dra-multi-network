        validValues:
        - "1"
        value: "2"
    effectPermissions:
    - linux/create-ipvlan/v1
    - linux/link-configure/v1
    mode: l2
    persona: ipvlan
    plugin: programmable-ipvlan
  priority: 100
  selector:
    kind: PF
    pciAddresses:
    - "0000:29:00.0"
---
apiVersion: networking.dra-multi-network.schseba.github.io/v1alpha1
