apiVersion: networking.dra-multi-network.schseba.github.io/v1alpha1
kind: DeviceExposurePolicy
metadata:
  name: secondary-host
spec:
  action: Expose
  exposure:
    effectPermissions:
    - linux/link-move/v1
    - linux/link-configure/v1
    mode: kernel
    persona: kernel
    plugin: host-cni
  priority: 100
  selector:
    kind: PF
    pciAddresses:
    - "0000:29:00.0"
---
apiVersion: networking.dra-multi-network.schseba.github.io/v1alpha1
kind: DeviceExposurePolicy
metadata:
  name: secondary-macvlan
spec:
  action: Expose
  exposure:
    allowMultipleAllocations: true
    capacity:
      children:
        default: "1"
        validValues:
        - "1"
        value: "2"
    effectPermissions:
    - linux/create-macvlan/v1
    - linux/link-configure/v1
    mode: bridge
    persona: macvlan
    plugin: programmable-macvlan
  priority: 100
  selector:
    kind: PF
    pciAddresses:
    - "0000:29:00.0"
---
apiVersion: networking.dra-multi-network.schseba.github.io/v1alpha1
kind: DeviceExposurePolicy
metadata:
  name: secondary-ipvlan
spec:
  action: Expose
  exposure:
    allowMultipleAllocations: true
    capacity:
      children:
