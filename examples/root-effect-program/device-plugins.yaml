apiVersion: networking.dra-multi-network.schseba.github.io/v1alpha1
kind: NetworkPlugin
metadata:
  name: programmable-macvlan
spec:
  allocationProfileRef:
    digest: 23bf5d6903187448de3a928feb676418b96aea5bb7e391a8e8d2e1ac56fc1b8b
    name: macvlan-cni
  allowedEffects:
  - linux/create-macvlan/v1
  - linux/link-configure/v1
  configSchema:
    additionalProperties: false
    properties:
      ifName:
        pattern: ^[A-Za-z0-9_.-]{1,15}$
        type: string
      linkType:
        enum:
        - ethernet
        type: string
      mode:
        enum:
        - bridge
        type: string
      mtu:
        maximum: 9000
        minimum: 576
        type: integer
      up:
        type: boolean
    required:
    - ifName
    - mtu
    - up
    - mode
    - linkType
    type: object
  hooks:
    ConnectNetwork:
      apiVersion: effects.dra-multi-network.schseba.github.io/v1alpha1
      effects:
      - id: child
        inputs:
          parent:
            from: call.allocation
        kind: linux/create-macvlan/v1
        parameterBindings:
          ifName:
            from: call.config.ifName
          mode:
            from: call.config.mode
          mtu:
            from: call.config.mtu
        parameters: {}
        postconditions:
        - kind: native-state-match
        recovery:
          strategy: ObserveAndReconcile
        requires:
        - kind: allocation-and-owned-inputs
      - id: ready
        inputs:
          interface:
            from: effects.child.interface
        kind: linux/link-configure/v1
        parameterBindings:
          mtu:
            from: call.config.mtu
          up:
            from: call.config.up
        parameters: {}
        postconditions:
        - kind: native-state-match
        recovery:
          strategy: ObserveAndReconcile
        requires:
        - kind: allocation-and-owned-inputs
      exports:
        interface:
          from: effects.ready.interface
    NodePrepare:
      apiVersion: effects.dra-multi-network.schseba.github.io/v1alpha1
      effects: []
      exports: {}
    NodeUnprepare:
      apiVersion: effects.dra-multi-network.schseba.github.io/v1alpha1
      restoreRecordedHook: NodePrepare
    RemoveNetwork:
      apiVersion: effects.dra-multi-network.schseba.github.io/v1alpha1
      restoreRecordedHook: ConnectNetwork
  implementation:
    type: EffectProgram
    version: allocation-effects-v1
  kind: Allocation
  outputs:
    interface:
      linkType: ethernet
      maxItems: 1
      minItems: 1
      ownership: Created
      type: KernelInterface/v1
  stateContract:
    cleanup: RecordedEffects
    version: v1
status: {}
