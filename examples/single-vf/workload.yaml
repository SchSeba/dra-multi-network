apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata: {name: CLAIM_TEMPLATE, namespace: multi-network-example}
spec:
  spec:
    devices:
      requests:
      - name: endpoint
        exactly:
          deviceClassName: ROOT_CLASS
          allocationMode: ExactCount
          count: 1
---
apiVersion: v1
kind: Pod
metadata: {name: POD_NAME, namespace: multi-network-example}
spec:
  resourceClaims:
  - {name: network, resourceClaimTemplateName: CLAIM_TEMPLATE}
  containers:
  - name: app
    image: quay.io/schseba/toolbox:latest
    command: [sleep, infinity]
    securityContext: {capabilities: {add: [NET_ADMIN, NET_RAW]}}
    resources: {claims: [{name: network}]}
