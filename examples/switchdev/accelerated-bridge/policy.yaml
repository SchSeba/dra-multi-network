apiVersion: networking.dra-multi-network.schseba.github.io/v1alpha1
kind: DeviceExposurePolicy
metadata: {name: switchdev-bridge-vfs}
spec:
  priority: 200
  selector:
    kind: VF
    parentPCIAddresses: ["0000:29:00.0"]
    pciAddresses: ["0000:29:10.0", "0000:29:10.2"]
  action: Expose
  exposure:
    persona: switchdev-bridge
    plugin: sriov-cni-switchdev
    mode: kernel
    effectPermissions:
      - linux/representor-map/v1
      - linux/link-move/v1
      - linux/link-configure/v1
      - linux/representor-bridge/v1
    allowedHostBridges:
      - name: swbr0
        alias: site/swbr0
        vlans: [100, 200, 300]
