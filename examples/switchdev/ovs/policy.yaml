apiVersion: networking.dra-multi-network.schseba.github.io/v1alpha1
kind: DeviceExposurePolicy
metadata: {name: switchdev-ovs-vfs}
spec:
  priority: 200
  selector:
    kind: VF
    parentPCIAddresses: ["0000:29:00.0"]
    pciAddresses: ["0000:29:10.4", "0000:29:10.6"]
  action: Expose
  exposure:
    persona: switchdev-ovs
    plugin: sriov-cni-switchdev
    mode: kernel
    effectPermissions:
      - linux/representor-map/v1
      - linux/link-move/v1
      - linux/link-configure/v1
      - ovs/representor-port/v1
    allowedOVSBridges:
      - name: ovsbr0
        uuid: "OVS_BRIDGE_UUID"
        identity: site/ovsbr0
        vlans: [100, 200, 300]
