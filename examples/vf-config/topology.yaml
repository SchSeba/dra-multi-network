apiVersion: networking.dra-multi-network.schseba.github.io/v1alpha1
kind: NetworkTopology
metadata: {name: configured-vf}
spec:
  effectBudget:
    allow: [linux/vf-configure/v1, linux/link-move/v1, linux/link-configure/v1]
  steps:
    - id: endpoint
      kind: Allocation
      pluginRef: {name: sriov-cni-configured}
      selectors: ['device.attributes["dra-multi-network.schseba.github.io"].pciAddress == "0000:29:11.0"']
      config:
        mode: kernel
        linkType: ethernet
        rdmaAccess: false
        ifName: secondary0
        mtu: 1500
        up: true
        vf:
          mac: "02:00:00:00:00:14"
          trust: true
          spoofCheck: false
          vlanId: 37
          vlanQoS: 2
          vlanProtocol: "802.1Q"
