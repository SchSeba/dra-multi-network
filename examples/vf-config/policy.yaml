apiVersion: networking.dra-multi-network.schseba.github.io/v1alpha1
kind: DeviceExposurePolicy
metadata: {name: secondary-vf-configured}
spec:
  priority: 100
  selector: {kind: VF, pciAddresses: ["0000:29:11.0"]}
  action: Expose
  exposure:
    persona: configured
    plugin: sriov-cni-configured
    mode: kernel
    effectPermissions: [linux/vf-configure/v1, linux/link-move/v1, linux/link-configure/v1]
    allowedVFSettings: [mac, trust, spoofCheck, vlanId, vlanQoS, vlanProtocol]
