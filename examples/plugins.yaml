            maximum: 1000000
            minimum: 0
            type: integer
          spoofCheck:
            type: boolean
          trust:
            type: boolean
          vlanId:
            maximum: 4094
            minimum: 0
            type: integer
          vlanProtocol:
            enum:
            - 802.1Q
            - 802.1ad
            type: string
          vlanQoS:
            maximum: 7
            minimum: 0
            type: integer
        type: object
    required:
    - mode
    - linkType
    - driver
    - accessBackend
    - vf
