apiVersion: networking.dra-multi-network.schseba.github.io/v1alpha1
kind: NetworkPlugin
metadata:
  name: sriov-cni-configured
spec:
  allowedEffects:
  - linux/vf-configure/v1
  - linux/link-move/v1
  - linux/link-configure/v1
  configSchema:
    additionalProperties: false
    properties:
      ifName:
        pattern: ^[A-Za-z0-9_.-]{1,15}$
        type: string
      linkType:
        enum:
        - ethernet
        type: string
      mode:
        enum:
        - kernel
        type: string
      mtu:
        maximum: 9000
        minimum: 576
        type: integer
      rdmaAccess:
        enum:
        - false
        type: boolean
      up:
        type: boolean
      vf:
        additionalProperties: false
        minProperties: 1
        properties:
          linkState:
            enum:
            - auto
            - enable
            - disable
            type: string
          mac:
            pattern: ^[0-9a-fA-F]{2}(:[0-9a-fA-F]{2}){5}$
            type: string
          maxTxRate:
            maximum: 1000000
            minimum: 0
            type: integer
          minTxRate:
            maximum: 1000000
            minimum: 0
            type: integer
          spoofCheck:
            type: boolean
          trust:
            type: boolean
          vlanId:
            maximum: 4094
            minimum: 0
            type: integer
          vlanProtocol:
            enum:
            - 802.1Q
            - 802.1ad
            type: string
          vlanQoS:
            maximum: 7
            minimum: 0
            type: integer
        type: object
    required:
    - ifName
    - mtu
    - up
    - mode
    - linkType
    - rdmaAccess
    - vf
    type: object
  implementation:
    name: sriov-cni
    type: Builtin
    version: vf-config-v1
  kind: Allocation
  outputs:
    interface:
      linkType: ethernet
      maxItems: 1
      minItems: 1
      ownership: Exclusive
      type: KernelInterface/v1
  stateContract:
    cleanup: RecordedEffects
    version: v1
