# Reference: the DRA driver's controller automatically installs these builtin NetworkPlugins.
# See README.md; this file does not need to be applied separately.
apiVersion: networking.dra-multi-network.schseba.github.io/v1alpha1
kind: NetworkPlugin
metadata:
  name: accelerated-bridge-cni
spec:
  allowedEffects:
  - linux/representor-bridge/v1
  configSchema:
    additionalProperties: false
    properties:
      bridge:
        pattern: ^[A-Za-z0-9_.-]{1,15}$
        type: string
      mtu:
        maximum: 9000
        minimum: 576
        type: integer
      trunk:
        items:
          maximum: 4094
          minimum: 1
          type: integer
        maxItems: 4094
        type: array
        uniqueItems: true
      up:
        type: boolean
      vlanId:
        maximum: 4094
        minimum: 0
        type: integer
    required:
    - bridge
    - mtu
    - up
    - vlanId
    type: object
  implementation:
    name: accelerated-bridge-cni
    type: Builtin
    version: v1
  inputs:
    representor:
      access: ExclusiveMaster
      linkType: ethernet
      maxItems: 1
      minItems: 1
      type: HostRepresentor/v1
  kind: Operation
  outputs:
    representor:
      linkType: ethernet
      maxItems: 1
      minItems: 1
      ownership: Exclusive
      type: HostRepresentor/v1
  stateContract:
    cleanup: RecordedEffects
    version: v1
---
