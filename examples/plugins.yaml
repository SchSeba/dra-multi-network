      mtu:
        maximum: 9000
        minimum: 576
        type: integer
      up:
        type: boolean
    required:
    - ifName
    - mtu
    - up
    - mode
    - monitorIntervalMs
    - failOverMac
    type: object
  implementation:
    name: bond-cni
    type: Builtin
    version: v1
  inputs:
    members:
      access: ExclusiveMaster
      linkType: ethernet
      maxItems: 8
      minItems: 2
      type: KernelInterface/v1
  kind: Operation
  outputs:
    interface:
      linkType: ethernet
      maxItems: 1
      minItems: 1
      ownership: Exclusive
      type: KernelInterface/v1
  stateContract:
    cleanup: RecordedEffects
    version: v1
