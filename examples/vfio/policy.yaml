apiVersion: networking.dra-multi-network.schseba.github.io/v1alpha1
kind: DeviceExposurePolicy
metadata: {name: secondary-vfio}
spec:
  priority: 100
  selector: {kind: VF, pciAddresses: ["0000:29:11.0"]}
  action: Expose
  exposure:
    persona: vfio
    plugin: sriov-cni-vfio
    mode: vfio
    allowedDrivers: [igbvf, vfio-pci]
    effectPermissions: [linux/driver-bind/v1, runtime/device-access/v1]
