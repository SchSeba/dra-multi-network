apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata: {name: CLAIM_TEMPLATE, namespace: multi-network-example}
spec:
  spec:
    devices:
      requests:
      - name: endpoint
        exactly: {deviceClassName: ROOT_CLASS, allocationMode: ExactCount, count: 1}
---
apiVersion: v1
kind: Pod
metadata:
  name: vfio-mvp
  namespace: multi-network-example
  annotations:
    required-plugins.noderesource.dev: '["dra-multi-network"]'
spec:
  terminationGracePeriodSeconds: 1
  nodeSelector: {dra-multi-network.schseba.github.io/ready: "true"}
  resourceClaims:
  - {name: endpoint, resourceClaimTemplateName: CLAIM_TEMPLATE}
  initContainers:
  - name: verify-vfio
    image: quay.io/schseba/toolbox:latest
    command: [python3, -c]
    args:
    - |
      import fcntl, glob, os, stat, struct
      groups = [p for p in glob.glob('/dev/vfio/*') if os.path.basename(p).isdigit()]
      assert len(groups) == 1, groups
      with open('/dev/vfio/vfio', 'r+b', buffering=0) as control:
        assert fcntl.ioctl(control, (ord(';') << 8) | 100) == 0
      with open(groups[0], 'r+b', buffering=0) as group:
        status = bytearray(struct.pack('II', 8, 0))
        fcntl.ioctl(group, (ord(';') << 8) | 103, status, True)
        assert struct.unpack('II', status)[1] & 1, status
        assert stat.S_ISCHR(os.fstat(group.fileno()).st_mode)
      print('PASS: one allocated, viable VFIO group and working VFIO API access:', groups[0])
    resources: {claims: [{name: endpoint}]}
  containers:
  - name: app
    image: quay.io/schseba/toolbox:latest
    command: [python3, -c]
    args:
    - |
      import glob, os, time
      groups = [p for p in glob.glob('/dev/vfio/*') if os.path.basename(p).isdigit()]
      assert len(groups) == 1, groups
      group = open(groups[0], 'r+b', buffering=0)
      print('Holding allocated VFIO group:', groups[0], flush=True)
      while True:
        time.sleep(3600)
    resources: {claims: [{name: endpoint}]}
