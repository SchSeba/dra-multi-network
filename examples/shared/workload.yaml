apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata: {name: CLAIM_TEMPLATE, namespace: multi-network-example}
spec:
  spec:
    devices:
      requests:
      - name: secondary
        exactly:
          deviceClassName: ROOT_CLASS
          allocationMode: ExactCount
          count: 1
---
apiVersion: v1
kind: Pod
metadata:
  name: POD_NAME
  namespace: multi-network-example
  annotations:
    required-plugins.noderesource.dev: '["dra-multi-network"]'
spec:
  terminationGracePeriodSeconds: 1
  nodeSelector: {dra-multi-network.schseba.github.io/ready: "true"}
  resourceClaims:
  - {name: secondary, resourceClaimTemplateName: CLAIM_TEMPLATE}
  initContainers:
  - name: verify-network
    image: quay.io/schseba/toolbox:latest
    securityContext: {capabilities: {add: [NET_ADMIN, NET_RAW]}}
    command: [/bin/bash, -ec, "ip -d link show secondary0; test $(cat /sys/class/net/secondary0/mtu) = 1500"]
    resources: {claims: [{name: secondary}]}
  containers:
  - name: app
    image: quay.io/schseba/toolbox:latest
    command: [sleep, infinity]
    securityContext: {capabilities: {add: [NET_ADMIN, NET_RAW]}}
    resources: {claims: [{name: secondary}]}
