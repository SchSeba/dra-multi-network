# Lab-specific secondary VFs. Never use a primary-network endpoint.
apiVersion: networking.dra-multi-network.schseba.github.io/v1alpha1
kind: DeviceExposurePolicy
metadata: {name: vf-macvlan}
spec:
  priority: 100
  selector: {kind: VF, pciAddresses: ["0000:29:10.0"]}
  action: Expose
  exposure:
    persona: macvlan
    plugin: macvlan-cni
    mode: bridge
    allowMultipleAllocations: true
    capacity:
      children: {value: "2", default: "1", validValues: ["1"]}
    effectPermissions: [linux/create-macvlan/v1, linux/link-configure/v1]
---
apiVersion: networking.dra-multi-network.schseba.github.io/v1alpha1
kind: DeviceExposurePolicy
metadata: {name: vf-ipvlan}
spec:
  priority: 100
  selector: {kind: VF, pciAddresses: ["0000:29:10.2"]}
  action: Expose
  exposure:
    persona: ipvlan
    plugin: ipvlan-cni
    mode: l2
    allowMultipleAllocations: true
    capacity:
      children: {value: "2", default: "1", validValues: ["1"]}
    effectPermissions: [linux/create-ipvlan/v1, linux/link-configure/v1]
